<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160">
<rect width="1800" height="1160" fill="#f4f7fb"/>
<text x="64" y="100" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#17243b">Feature phones on weak networks</text>
<text x="66" y="154" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#526279">Proposed design and acceptance framework • no PMAOS recovery measurements asserted</text>
<rect x="64" y="228" width="1672" height="146" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
<rect x="65" y="229" width="8" height="144" rx="4" fill="#2457a6"/>
<text x="92" y="282" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2457a6">Start with the task dependency</text>
<text x="92" y="336" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#17243b">A signal icon does not establish access to every service.</text>
<polyline points="900,374 900,396 330,396 330,424" fill="none" stroke="#aab8c9" stroke-width="5" stroke-linejoin="round"/>
<polygon points="330.0,424.0 322.6,408.7 337.4,408.7" fill="#aab8c9"/>
