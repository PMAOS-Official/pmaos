<polyline points="900,374 900,396 1470,396 1470,424" fill="none" stroke="#aab8c9" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1470.0,424.0 1462.6,408.7 1477.4,408.7" fill="#aab8c9"/>
<rect x="64" y="424" width="532" height="185" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
<rect x="65" y="425" width="8" height="183" rx="4" fill="#0f766e"/>
<text x="92" y="478" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f766e">Local task</text>
<text x="92" y="533" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">A function without a network</text>
<text x="92" y="570" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">dependency</text>
<rect x="634" y="424" width="532" height="185" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
<rect x="635" y="425" width="8" height="183" rx="4" fill="#6845a5"/>
<text x="662" y="478" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#6845a5">Operator communication</text>
<text x="662" y="533" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">Calls / SMS depend on modem and</text>
<text x="662" y="570" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">operator conditions</text>
<rect x="1204" y="424" width="532" height="185" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
<rect x="1205" y="425" width="8" height="183" rx="4" fill="#2457a6"/>
<text x="1232" y="478" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2457a6">Connected service</text>
<text x="1232" y="533" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">AI, messaging or content with a</text>
<text x="1232" y="570" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">remote dependency</text>
<polyline points="330,609 330,637" fill="none" stroke="#aab8c9" stroke-width="5" stroke-linejoin="round"/>
<polygon points="330.0,637.0 322.6,621.7 337.4,621.7" fill="#aab8c9"/>
<polyline points="900,609 900,637" fill="none" stroke="#aab8c9" stroke-width="5" stroke-linejoin="round"/>
