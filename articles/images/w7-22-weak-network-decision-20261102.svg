<polyline points="1470,609 1470,637" fill="none" stroke="#aab8c9" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1470.0,637.0 1462.6,621.7 1477.4,621.7" fill="#aab8c9"/>
<rect x="64" y="637" width="532" height="251" rx="18" fill="#edf8f4" stroke="#dbe3ee" stroke-width="2"/>
<rect x="65" y="638" width="8" height="249" rx="4" fill="#0f766e"/>
<text x="92" y="690" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#0f766e">Validate local usability</text>
<text x="92" y="744" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">Open, interact and return home.</text>
<text x="92" y="781" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">Test the actual app and build.</text>
<rect x="634" y="637" width="532" height="251" rx="18" fill="#f3effb" stroke="#dbe3ee" stroke-width="2"/>
<rect x="635" y="638" width="8" height="249" rx="4" fill="#6845a5"/>
<text x="662" y="690" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#6845a5">Test separately</text>
<text x="662" y="744" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">Record radio, operator and service</text>
<text x="662" y="781" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">conditions.</text>
<text x="662" y="818" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">Data failure is a different case.</text>
<rect x="1204" y="637" width="532" height="251" rx="18" fill="#eaf1ff" stroke="#dbe3ee" stroke-width="2"/>
<rect x="1205" y="638" width="8" height="249" rx="4" fill="#2457a6"/>
<text x="1232" y="690" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#2457a6">Define failure behavior</text>
<text x="1232" y="744" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">Deadline • cancellation</text>
<text x="1232" y="781" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">Bounded retries only when safe</text>
<text x="1232" y="818" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#17243b">Handle stale responses</text>
<text x="64" y="1090" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#526279">Suggested checks only: record board, firmware, service and network condition. Bound queues and buffers; do not infer offline AI.</text>
</svg>